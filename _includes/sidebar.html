{%- comment -%}GUIDA-SVILUPPO: override locale del sidebar del tema: nei post il bottone "Cerca nel Blog" sta sopra il blocco autore.{%- endcomment -%}
{% if page.author_profile or page.sidebar %}
<div class="sidebar sticky">
  {% if page.collection == "posts" %}
  <button type="button" onclick="var t=document.querySelector('.search__toggle');if(t){t.click();}" style="display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .8rem;margin:12px 0 4px;line-height:1.2;border:1px solid #e9e3d9;border-radius:999px;background:#fff;color:#7a746b;font:inherit;font-size:.8rem;cursor:pointer">Cerca nel Blog <span aria-hidden="true">&#128269;</span></button>
  {% endif %}
  {% include author-profile.html %}
</div>
{% endif %}
